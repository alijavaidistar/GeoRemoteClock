<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometris Clock - Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #212529;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-bottom: 1px solid #e0e0e0;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-brand .logo-small {
      height: 34px;
      width: auto;
    }

    .navbar-brand h1 {
      font-size: 1.35rem;
      font-weight: bold;
      color: #1a1a1a;
    }

    .navbar-brand .admin-badge {
      background-color: #2e5da8;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .btn-logout {
      background-color: #f1f3f5;
      border: none;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      display: none;
    }

    .btn-logout:hover { background-color: #e4e7ea; }

    main {
      flex: 1;
      padding: 30px 24px 60px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== Login view ===== */
    .login-box {
      max-width: 380px;
      margin: 70px auto 0;
      border: 1px solid #dee2e6;
      padding: 30px;
      text-align: center;
    }

    .login-box img { width: 90px; margin-bottom: 18px; }

    .login-box h2 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #1a1a1a;
    }

    .login-box p {
      color: #8a94a6;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .login-box input {
      display: block;
      width: 100%;
      padding: 14px 12px;
      font-size: 1.05rem;
      border: 1px solid #1a1a1a;
      margin-bottom: 16px;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-box button {
      width: 100%;
      background-color: #2e5da8;
      color: #ffffff;
      border: none;
      padding: 14px 0;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-box button:hover { background-color: #274f90; }
    .login-box button:disabled { opacity: 0.6; }

    .login-error {
      color: #c0392b;
      font-size: 0.92rem;
      margin-top: 14px;
      display: none;
    }

    /* ===== Report view ===== */
    #reportView { display: none; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
    }

    .period-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .period-nav button {
      background-color: #f1f3f5;
      border: 1px solid #dee2e6;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .period-nav button:hover { background-color: #e4e7ea; }

    .period-nav button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .period-nav button:disabled:hover { background-color: #f1f3f5; }

    .period-label {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1a1a1a;
      min-width: 230px;
      text-align: center;
    }

    .controls-right { display: flex; gap: 10px; }

    .mode-btn, .print-btn {
      background-color: #f1f3f5;
      border: 1px solid #dee2e6;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .mode-btn.active {
      background-color: #2e5da8;
      border-color: #2e5da8;
      color: #ffffff;
    }

    .print-btn { background-color: #2e5da8; border-color: #2e5da8; color: #ffffff; }
    .print-btn:hover { background-color: #274f90; }

    .loading, .empty-msg {
      text-align: center;
      color: #8a94a6;
      padding: 40px 0;
      font-size: 1.05rem;
    }

    /* ===== Stats row ===== */
    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .stat-box {
      flex: 1;
      min-width: 150px;
      border: 1px solid #dee2e6;
      border-top: 3px solid #2e5da8;
      padding: 16px 20px;
      text-align: center;
    }

    .stat-box .stat-num {
      font-size: 1.9rem;
      font-weight: bold;
      color: #2e5da8;
    }

    .stat-box .stat-label {
      font-size: 0.85rem;
      color: #8a94a6;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* ===== Employee cards ===== */
    .emp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .emp-card {
      border: 1px solid #dee2e6;
      border-left: 4px solid #2e5da8;
      padding: 16px 18px;
      break-inside: avoid;
    }

    .emp-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .emp-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1a1a1a;
      overflow-wrap: anywhere;
    }

    .emp-total {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2e5da8;
      white-space: nowrap;
    }

    .emp-total .unit {
      font-size: 0.85rem;
      color: #8a94a6;
      margin-left: 4px;
      font-weight: bold;
    }

    .week-chips {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .chip {
      background-color: #f1f3f5;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: #495057;
      border-radius: 4px;
    }

    .chip b { color: #1a1a1a; }

    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      border: 1px solid #e9ecef;
      padding: 5px 2px;
      text-align: center;
      background-color: #fafbfc;
    }

    .day-cell.has {
      background-color: #eaf1fb;
      border-color: #b9cdea;
    }

    .day-label {
      font-size: 0.65rem;
      color: #8a94a6;
      font-weight: bold;
      text-transform: uppercase;
    }

    .day-cell.has .day-label { color: #2e5da8; }

    .day-val {
      font-size: 0.82rem;
      font-weight: bold;
      color: #adb5bd;
      margin-top: 2px;
    }

    .day-cell.has .day-val { color: #1a1a1a; }

    .open-badge {
      display: inline-block;
      background-color: #d4edda;
      color: #1e9e50;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
    }

    footer {
      border-top: 1px solid #e0e0e0;
      padding: 22px 20px;
      text-align: center;
      color: #6c757d;
      font-weight: bold;
      font-size: 0.95rem;
    }

    footer .sep { margin: 0 14px; color: #adb5bd; }

    /* ===== Print ===== */
    @media print {
      .navbar .btn-logout, .period-nav button, .controls-right { display: none !important; }
      .navbar { border-bottom: 2px solid #000; }
      main { padding: 10px 0; }
      footer { display: none; }
      .table-wrap { overflow: visible; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-brand">
      <img class="logo-small" src="logo-mark.png" alt="Geometris logo">
      <h1>Geometris Clock</h1>
      <span class="admin-badge">ADMIN</span>
    </div>
    <button class="btn-logout" id="btnLogout" type="button">Log out</button>
  </header>

  <main>

    <!-- ===== Login ===== -->
    <div class="login-box" id="loginView">
      <img src="logo-mark.png" alt="">
      <h2>Admin Login</h2>
      <p>Enter the admin password to view reports.</p>
      <input type="password" id="adminPass" autocomplete="off" placeholder="Password">
      <button id="btnLogin" type="button">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </div>

    <!-- ===== Report ===== -->
    <div id="reportView">
      <div class="controls">
        <div class="period-nav">
          <button id="btnPrev" type="button">&#9664; Prev</button>
          <div class="period-label" id="periodLabel"></div>
          <button id="btnNext" type="button">Next &#9654;</button>
        </div>
        <div class="controls-right">
          <button class="mode-btn active" id="btnModePeriod" type="button">Pay Period</button>
          <button class="mode-btn" id="btnModeWeek" type="button">Weekly</button>
          <button class="print-btn" id="btnPrint" type="button">&#128424; Print</button>
        </div>
      </div>

      <div class="loading" id="loadingMsg" style="display:none">Loading&hellip;</div>
      <div id="reportContent"></div>
    </div>

  </main>

  <footer>
    &copy; 2026 Geometris LP.<span class="sep">|</span>Made by Ali Javaid
  </footer>

  <script>
    // Apps Script Web App URL (same backend as the punch page)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPvTH197EclIif13l4h0i6dRG895XEOsYhoqjLNyaf8vDvuMaHQN66S6YdNcQMKj9vqQ/exec';

    // Pay-period anchor: periods run Wed -> Tue, 14 days.
    // Aug 19, 2026 (a Wednesday) started a period.
    const ANCHOR = new Date(2026, 7, 19);

    let mode = 'period'; // 'period' (14 days) or 'week' (7 days)
    let offset = 0;      // 0 = current, -1 = previous, ...
    let password = sessionStorage.getItem('adminPass') || '';

    const $ = id => document.getElementById(id);

    function ymd(d) {
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function niceDate(d, withYear) {
      const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return m[d.getMonth()] + ' ' + d.getDate() + (withYear ? ', ' + d.getFullYear() : '');
    }

    function currentRange() {
      const len = mode === 'period' ? 14 : 7;
      const today = new Date();
      const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const diffDays = Math.floor((today0 - ANCHOR) / 86400000);
      const idx = Math.floor(diffDays / len) + offset;
      const start = new Date(ANCHOR);
      start.setDate(ANCHOR.getDate() + idx * len);
      const end = new Date(start);
      end.setDate(start.getDate() + len - 1);
      return { start, end, len };
    }

    function rangeDays(range) {
      const days = [];
      for (let i = 0; i < range.len; i++) {
        const d = new Date(range.start);
        d.setDate(range.start.getDate() + i);
        days.push(d);
      }
      return days;
    }

    async function fetchReport(range) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'report',
          password: password,
          start: ymd(range.start),
          end: ymd(range.end)
        })
      });
      return res.json();
    }

    function render(data, range) {
      const days = rangeDays(range);
      const emps = data.employees;

      if (!emps.length) {
        $('reportContent').innerHTML = '<div class="empty-msg">No punches recorded in this range.</div>';
        return;
      }

      let grand = 0, openCount = 0;
      for (const e of emps) { grand += e.total; if (e.open) openCount++; }
      grand = Math.round(grand * 100) / 100;

      let html = '<div class="stats-row">'
        + '<div class="stat-box"><div class="stat-num">' + emps.length + '</div><div class="stat-label">Employees</div></div>'
        + '<div class="stat-box"><div class="stat-num">' + grand.toFixed(2) + '</div><div class="stat-label">Total Hours</div></div>'
        + '<div class="stat-box"><div class="stat-num">' + openCount + '</div><div class="stat-label">Clocked In Now</div></div>'
        + '</div>';

      html += '<div class="emp-grid">';
      const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      for (const e of emps) {
        let w1 = 0, w2 = 0;
        days.forEach((d, i) => {
          const h = e.days[ymd(d)] || 0;
          if (i < 7) w1 += h; else w2 += h;
        });
        w1 = Math.round(w1 * 100) / 100;
        w2 = Math.round(w2 * 100) / 100;

        const badge = e.open ? '<span class="open-badge">clocked in</span>' : '';
        html += '<div class="emp-card">'
          + '<div class="emp-head"><div class="emp-name">' + e.name + badge + '</div>'
          + '<div class="emp-total">' + e.total.toFixed(2) + '<span class="unit">hrs</span></div></div>';

        if (mode === 'period') {
          html += '<div class="week-chips">'
            + '<span class="chip">Week 1: <b>' + w1.toFixed(2) + '</b></span>'
            + '<span class="chip">Week 2: <b>' + w2.toFixed(2) + '</b></span>'
            + '</div>';
        }

        html += '<div class="day-strip">';
        for (const d of days) {
          const h = e.days[ymd(d)] || 0;
          html += '<div class="day-cell' + (h ? ' has' : '') + '">'
            + '<div class="day-label">' + wd[d.getDay()] + ' ' + d.getDate() + '</div>'
            + '<div class="day-val">' + (h ? h.toFixed(2) : '-') + '</div>'
            + '</div>';
        }
        html += '</div></div>';
      }
      html += '</div>';

      $('reportContent').innerHTML = html;
    }

    async function loadReport() {
      const range = currentRange();
      $('btnNext').disabled = offset >= 0; // no browsing into the future
      $('periodLabel').textContent = niceDate(range.start, false) + ' - ' + niceDate(range.end, true);
      $('loadingMsg').style.display = 'block';
      $('reportContent').innerHTML = '';
      try {
        const data = await fetchReport(range);
        $('loadingMsg').style.display = 'none';
        if (!data.ok) {
          if (data.error === 'Wrong password.') { logout(); showLoginError('Session expired - wrong password.'); return; }
          $('reportContent').innerHTML = '<div class="empty-msg">' + data.error + '</div>';
          return;
        }
        render(data, range);
      } catch (err) {
        $('loadingMsg').style.display = 'none';
        $('reportContent').innerHTML = '<div class="empty-msg">Connection error - could not reach the server.</div>';
      }
    }

    function showLoginError(msg) {
      $('loginError').textContent = msg;
      $('loginError').style.display = 'block';
    }

    function showReport() {
      $('loginView').style.display = 'none';
      $('reportView').style.display = 'block';
      $('btnLogout').style.display = 'inline-block';
      loadReport();
    }

    function logout() {
      password = '';
      sessionStorage.removeItem('adminPass');
      $('reportView').style.display = 'none';
      $('btnLogout').style.display = 'none';
      $('loginView').style.display = 'block';
      $('adminPass').value = '';
    }

    async function login() {
      const pass = $('adminPass').value.trim();
      if (!pass) return;
      $('btnLogin').disabled = true;
      $('btnLogin').textContent = 'Checking...';
      $('loginError').style.display = 'none';

      password = pass;
      const range = currentRange();
      try {
        const data = await fetchReport(range);
        if (data.ok) {
          sessionStorage.setItem('adminPass', pass);
          showReport();
        } else {
          password = '';
          showLoginError(data.error || 'Login failed.');
        }
      } catch (err) {
        password = '';
        showLoginError('Connection error - could not reach the server.');
      }
      $('btnLogin').disabled = false;
      $('btnLogin').textContent = 'Sign In';
    }

    // ---- events ----
    $('btnLogin').addEventListener('click', login);
    $('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('btnLogout').addEventListener('click', logout);
    $('btnPrev').addEventListener('click', () => { offset--; loadReport(); });
    $('btnNext').addEventListener('click', () => { if (offset < 0) { offset++; loadReport(); } });
    $('btnPrint').addEventListener('click', () => window.print());
    $('btnModePeriod').addEventListener('click', () => {
      mode = 'period'; offset = 0;
      $('btnModePeriod').classList.add('active');
      $('btnModeWeek').classList.remove('active');
      loadReport();
    });
    $('btnModeWeek').addEventListener('click', () => {
      mode = 'week'; offset = 0;
      $('btnModeWeek').classList.add('active');
      $('btnModePeriod').classList.remove('active');
      loadReport();
    });

    // auto-login if password saved this browser session
    if (password) showReport();
  </script>

</body>
</html>
