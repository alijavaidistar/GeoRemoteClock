<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometris Clock - My Hours</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #212529;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-bottom: 1px solid #e0e0e0;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-brand .logo-small {
      height: 34px;
      width: auto;
    }

    .navbar-brand h1 {
      font-size: 1.35rem;
      font-weight: bold;
      color: #1a1a1a;
    }

    .navbar-brand .emp-badge {
      background-color: #1e9e50;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .nav-actions { display: flex; gap: 10px; }

    .btn-back, .btn-logout {
      background-color: #f1f3f5;
      border: none;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      text-decoration: none;
      display: inline-block;
    }

    .btn-back:hover, .btn-logout:hover { background-color: #e4e7ea; }
    .btn-logout { display: none; }

    main {
      flex: 1;
      padding: 30px 24px 60px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== Login view ===== */
    .login-box {
      max-width: 380px;
      margin: 70px auto 0;
      border: 1px solid #dee2e6;
      padding: 30px;
      text-align: center;
    }

    .login-box img { width: 90px; margin-bottom: 18px; }

    .login-box h2 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #1a1a1a;
    }

    .login-box p {
      color: #8a94a6;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .login-box input {
      display: block;
      width: 100%;
      padding: 14px 12px;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 6px;
      border: 1px solid #1a1a1a;
      margin-bottom: 16px;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-box button {
      width: 100%;
      background-color: #2e5da8;
      color: #ffffff;
      border: none;
      padding: 14px 0;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-box button:hover { background-color: #274f90; }
    .login-box button:disabled { opacity: 0.6; }

    .login-error {
      color: #c0392b;
      font-size: 0.92rem;
      margin-top: 14px;
      display: none;
    }

    /* ===== Report view ===== */
    #reportView { display: none; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
    }

    .period-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .period-nav button {
      background-color: #f1f3f5;
      border: 1px solid #dee2e6;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .period-nav button:hover { background-color: #e4e7ea; }

    .period-nav button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .period-nav button:disabled:hover { background-color: #f1f3f5; }

    .period-label {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1a1a1a;
      min-width: 230px;
      text-align: center;
    }

    .controls-right { display: flex; gap: 10px; }

    .mode-btn, .print-btn {
      background-color: #f1f3f5;
      border: 1px solid #dee2e6;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .mode-btn.active {
      background-color: #2e5da8;
      border-color: #2e5da8;
      color: #ffffff;
    }

    .print-btn { background-color: #2e5da8; border-color: #2e5da8; color: #ffffff; }
    .print-btn:hover { background-color: #274f90; }

    .loading, .empty-msg {
      text-align: center;
      color: #8a94a6;
      padding: 40px 0;
      font-size: 1.05rem;
    }

    /* ===== Employee card ===== */
    .emp-card {
      border: 1px solid #dee2e6;
      border-left: 4px solid #2e5da8;
      padding: 16px 18px;
    }

    .emp-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .emp-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1a1a1a;
      overflow-wrap: anywhere;
    }

    .emp-total {
      font-size: 1.6rem;
      font-weight: bold;
      color: #2e5da8;
      white-space: nowrap;
    }

    .emp-total .unit {
      font-size: 0.85rem;
      color: #8a94a6;
      margin-left: 4px;
      font-weight: bold;
    }

    .open-badge {
      display: inline-block;
      background-color: #d4edda;
      color: #1e9e50;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .sess-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #8a94a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 6px;
    }

    .table-wrap { overflow-x: auto; }

    .emp-card table {
      border-collapse: collapse;
      width: 100%;
      max-width: 560px;
      font-size: 0.9rem;
    }

    .emp-card th, .emp-card td {
      border: 1px solid #dee2e6;
      padding: 8px 6px;
      text-align: center;
      white-space: nowrap;
    }

    .emp-card th {
      background-color: #f1f3f5;
      font-weight: bold;
      color: #495057;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .emp-card td { color: #1a1a1a; }

    .emp-card td .zero, .zero { color: #adb5bd; }

    footer {
      border-top: 1px solid #e0e0e0;
      padding: 22px 20px;
      text-align: center;
      color: #6c757d;
      font-weight: bold;
      font-size: 0.95rem;
    }

    footer .sep { margin: 0 14px; color: #adb5bd; }

    /* ===== Print ===== */
    @media print {
      .nav-actions, .period-nav button, .controls-right { display: none !important; }
      .navbar { border-bottom: 2px solid #000; }
      main { padding: 10px 0; }
      footer { display: none; }
      .table-wrap { overflow: visible; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-brand">
      <img class="logo-small" src="logo-mark.png" alt="Geometris logo">
      <h1>Geometris Clock</h1>
      <span class="emp-badge">MY HOURS</span>
    </div>
    <div class="nav-actions">
      <a class="btn-back" href="index.html">&#8592; Home</a>
      <button class="btn-logout" id="btnLogout" type="button">Log out</button>
    </div>
  </header>

  <main>

    <!-- ===== Login ===== -->
    <div class="login-box" id="loginView">
      <img src="logo-mark.png" alt="">
      <h2>Employee Dashboard</h2>
      <p>Enter your PIN to view your hours.</p>
      <input type="password" id="empPin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">
      <button id="btnLogin" type="button">View My Hours</button>
      <div class="login-error" id="loginError"></div>
    </div>

    <!-- ===== Report ===== -->
    <div id="reportView">
      <div class="controls">
        <div class="period-nav">
          <button id="btnPrev" type="button">&#9664; Prev</button>
          <div class="period-label" id="periodLabel"></div>
          <button id="btnNext" type="button">Next &#9654;</button>
        </div>
        <div class="controls-right">
          <button class="mode-btn active" id="btnModePeriod" type="button">Pay Period</button>
          <button class="mode-btn" id="btnModeWeek" type="button">Weekly</button>
          <button class="print-btn" id="btnPrint" type="button">&#128424; Print</button>
        </div>
      </div>

      <div class="loading" id="loadingMsg" style="display:none">Loading&hellip;</div>
      <div id="reportContent"></div>
    </div>

  </main>

  <footer>
    &copy; 2026 Geometris LP.<span class="sep">|</span>Made by Ali Javaid
  </footer>

  <script>
    // Apps Script Web App URL (same backend as the punch page)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPvTH197EclIif13l4h0i6dRG895XEOsYhoqjLNyaf8vDvuMaHQN66S6YdNcQMKj9vqQ/exec';

    // Pay-period anchor: periods run Wed -> Tue, 14 days.
    // Aug 19, 2026 (a Wednesday) started a period.
    const ANCHOR = new Date(2026, 7, 19);

    let mode = 'period'; // 'period' (14 days) or 'week' (7 days)
    let offset = 0;      // 0 = current, -1 = previous, ...
    let pin = sessionStorage.getItem('empPin') || '';

    const $ = id => document.getElementById(id);

    function ymd(d) {
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function niceDate(d, withYear) {
      const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return m[d.getMonth()] + ' ' + d.getDate() + (withYear ? ', ' + d.getFullYear() : '');
    }

    function currentRange() {
      const len = mode === 'period' ? 14 : 7;
      const today = new Date();
      const today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const diffDays = Math.floor((today0 - ANCHOR) / 86400000);
      const idx = Math.floor(diffDays / len) + offset;
      const start = new Date(ANCHOR);
      start.setDate(ANCHOR.getDate() + idx * len);
      const end = new Date(start);
      end.setDate(start.getDate() + len - 1);
      return { start, end, len };
    }

    async function fetchReport(range) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'myreport',
          pin: pin,
          start: ymd(range.start),
          end: ymd(range.end)
        })
      });
      return res.json();
    }

    function render(data) {
      const badge = data.open ? '<span class="open-badge">clocked in</span>' : '';
      let html = '<div class="emp-card">'
        + '<div class="emp-head"><div class="emp-name">' + data.name + badge + '</div>'
        + '<div class="emp-total">' + data.total.toFixed(2) + '<span class="unit">hrs</span></div></div>';

      if (data.sessions && data.sessions.length) {
        html += '<div class="sess-title">Punch Times</div>'
          + '<div class="table-wrap"><table>'
          + '<tr><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Hours</th></tr>';
        for (const s of data.sessions) {
          html += '<tr><td>' + s.date + '</td><td>' + s.in + '</td>'
            + '<td>' + (s.out || '<span class="open-badge">still in</span>') + '</td>'
            + '<td>' + (s.hours == null ? '<span class="zero">-</span>' : s.hours.toFixed(2)) + '</td></tr>';
        }
        html += '</table></div>';
      } else {
        html += '<div class="empty-msg">No punches in this range.</div>';
      }

      html += '</div>';
      $('reportContent').innerHTML = html;
    }

    async function loadReport() {
      const range = currentRange();
      $('btnNext').disabled = offset >= 0; // no browsing into the future
      $('periodLabel').textContent = niceDate(range.start, false) + ' - ' + niceDate(range.end, true);
      $('loadingMsg').style.display = 'block';
      $('reportContent').innerHTML = '';
      try {
        const data = await fetchReport(range);
        $('loadingMsg').style.display = 'none';
        if (!data.ok) {
          if (data.error === 'Invalid PIN.') { logout(); showLoginError('Session expired - sign in again.'); return; }
          $('reportContent').innerHTML = '<div class="empty-msg">' + data.error + '</div>';
          return;
        }
        render(data);
      } catch (err) {
        $('loadingMsg').style.display = 'none';
        $('reportContent').innerHTML = '<div class="empty-msg">Connection error - could not reach the server.</div>';
      }
    }

    function showLoginError(msg) {
      $('loginError').textContent = msg;
      $('loginError').style.display = 'block';
    }

    function showReport() {
      $('loginView').style.display = 'none';
      $('reportView').style.display = 'block';
      $('btnLogout').style.display = 'inline-block';
      loadReport();
    }

    function logout() {
      pin = '';
      sessionStorage.removeItem('empPin');
      $('reportView').style.display = 'none';
      $('btnLogout').style.display = 'none';
      $('loginView').style.display = 'block';
      $('empPin').value = '';
    }

    async function login() {
      const p = $('empPin').value.trim();
      if (!p) return;
      $('btnLogin').disabled = true;
      $('btnLogin').textContent = 'Checking...';
      $('loginError').style.display = 'none';

      pin = p;
      const range = currentRange();
      try {
        const data = await fetchReport(range);
        if (data.ok) {
          sessionStorage.setItem('empPin', p);
          showReport();
        } else {
          pin = '';
          showLoginError(data.error || 'Login failed.');
        }
      } catch (err) {
        pin = '';
        showLoginError('Connection error - could not reach the server.');
      }
      $('btnLogin').disabled = false;
      $('btnLogin').textContent = 'View My Hours';
    }

    // ---- events ----
    $('btnLogin').addEventListener('click', login);
    $('empPin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('btnLogout').addEventListener('click', logout);
    $('btnPrev').addEventListener('click', () => { offset--; loadReport(); });
    $('btnNext').addEventListener('click', () => { if (offset < 0) { offset++; loadReport(); } });
    $('btnPrint').addEventListener('click', () => window.print());
    $('btnModePeriod').addEventListener('click', () => {
      mode = 'period'; offset = 0;
      $('btnModePeriod').classList.add('active');
      $('btnModeWeek').classList.remove('active');
      loadReport();
    });
    $('btnModeWeek').addEventListener('click', () => {
      mode = 'week'; offset = 0;
      $('btnModeWeek').classList.add('active');
      $('btnModePeriod').classList.remove('active');
      loadReport();
    });

    // auto-login if PIN saved this browser session
    if (pin) showReport();
  </script>

</body>
</html>
